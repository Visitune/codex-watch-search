name: Codex Discovery (daily snapshot check)
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/poc_fetch.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-snapshot
          path: data/catalog-snapshot.json
